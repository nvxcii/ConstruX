<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConstruX — Mission Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body class="h-full bg-gray-950 text-gray-100 flex flex-col" style="height:100dvh">

  <!-- Header -->
  <header class="shrink-0 border-b border-gray-800 bg-gray-900 px-5 py-3 flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-xs font-bold select-none">CX</div>
    <div>
      <h1 class="text-sm font-semibold text-white leading-tight">Multi-AI Mission Interface</h1>
      <p class="text-xs text-gray-400">Claude · Gemini · DeepSeek · ChatGPT</p>
    </div>
    <div id="status-badge" class="ml-auto hidden">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs bg-blue-900/60 text-blue-300 border border-blue-800">
        <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
        <span id="status-text">Running</span>
      </span>
    </div>
  </header>

  <!-- Messages -->
  <div id="messages" class="flex-1 overflow-y-auto px-4 py-5 space-y-3 min-h-0"></div>

  <!-- Phase progress bar (hidden until mission starts) -->
  <div id="progress-panel" class="hidden shrink-0 bg-gray-900 border-t border-gray-800 px-5 py-3">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs text-gray-500">Mission progress</span>
      <span id="phase-label" class="text-xs text-blue-400 font-medium"></span>
    </div>
    <div class="flex gap-2">
      <div id="p1" class="flex-1 h-1.5 rounded-full bg-gray-700 transition-colors duration-500"></div>
      <div id="p2" class="flex-1 h-1.5 rounded-full bg-gray-700 transition-colors duration-500"></div>
      <div id="p3" class="flex-1 h-1.5 rounded-full bg-gray-700 transition-colors duration-500"></div>
    </div>
    <div class="flex gap-2 mt-1 text-xs text-gray-600">
      <span class="flex-1 text-center">Intelligence</span>
      <span class="flex-1 text-center">Analysis</span>
      <span class="flex-1 text-center">Execution</span>
    </div>
  </div>

  <!-- Input -->
  <div class="shrink-0 border-t border-gray-800 bg-gray-900 px-4 py-3">
    <form id="form" class="flex gap-2 max-w-3xl mx-auto">
      <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="Type your message…"
        class="flex-1 bg-gray-800 text-gray-100 rounded-xl px-4 py-2.5 text-sm placeholder-gray-600
               border border-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/50"
      />
      <button
        id="send-btn"
        type="submit"
        class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm
               font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
      >Send</button>
    </form>
  </div>

<script>
const messagesEl  = document.getElementById('messages');
const form        = document.getElementById('form');
const inputEl     = document.getElementById('input');
const sendBtn     = document.getElementById('send-btn');
const progressPanel = document.getElementById('progress-panel');
const phaseLabelEl  = document.getElementById('phase-label');
const statusBadge   = document.getElementById('status-badge');
const statusTextEl  = document.getElementById('status-text');

let pollingTimer = null;
let lastPhase    = 0;

// ── Helpers ──────────────────────────────────────────────────────────────────

function escape(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  return escape(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code class="bg-gray-700 px-1 rounded text-blue-300 text-xs">$1</code>')
    .replace(/\n/g, '<br>');
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(role, text) {
  const isUser = role === 'user';
  const wrap   = document.createElement('div');
  wrap.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;

  const bubble = document.createElement('div');
  bubble.className = isUser
    ? 'max-w-lg bg-blue-600 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 text-sm leading-relaxed'
    : 'max-w-xl bg-gray-800 text-gray-100 rounded-2xl rounded-tl-sm px-4 py-2.5 text-sm leading-relaxed';
  bubble.innerHTML = renderMarkdown(text);

  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollBottom();
}

function fmt(n) {
  return (n != null && n !== '') ? '$' + Number(n).toLocaleString() : 'N/A';
}

function addResults(result) {
  const strategic  = result.strategic_analysis  || {};
  const leverage   = strategic.leverage_analysis  || {};
  const settlement = strategic.settlement_prediction || {};
  const execution  = result.execution_plan || {};
  const deployment = execution.deployment_summary  || {};

  const score    = leverage.overall_leverage_score;
  const risk     = leverage.risk_to_opponent || 'N/A';
  const range    = settlement.predicted_range || {};
  const demand   = settlement.recommended_demand;
  const floor    = settlement.recommended_floor;
  const complaints = deployment.total_complaints ?? 'N/A';
  const media    = deployment.media_approach || 'N/A';

  const pct = (typeof score === 'number') ? Math.min(100, Math.max(0, score)) : 0;
  const barColor = pct >= 70 ? 'bg-green-500' : pct >= 40 ? 'bg-yellow-500' : 'bg-red-500';

  const wrap = document.createElement('div');
  wrap.className = 'flex justify-start';

  const card = document.createElement('div');
  card.className = 'max-w-xl w-full bg-gray-800 border border-gray-700 rounded-2xl rounded-tl-sm p-5 space-y-5 text-sm';
  card.innerHTML = `
    <p class="text-green-400 font-semibold text-base">✓ Mission Complete</p>

    <div>
      <p class="text-gray-400 text-xs uppercase tracking-wide mb-2">Leverage Score</p>
      <div class="flex items-center gap-3">
        <div class="flex-1 h-2 bg-gray-700 rounded-full overflow-hidden">
          <div class="h-full rounded-full ${barColor} transition-all duration-700" style="width:${pct}%"></div>
        </div>
        <span class="text-white font-semibold tabular-nums">${score ?? 'N/A'}<span class="text-gray-500 font-normal">/100</span></span>
      </div>
      <p class="text-gray-500 text-xs mt-1">Risk to opponent: <span class="text-gray-300">${risk}</span></p>
    </div>

    <div>
      <p class="text-gray-400 text-xs uppercase tracking-wide mb-2">Settlement Range</p>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-gray-900 rounded-xl py-3 px-2">
          <p class="text-gray-500 text-xs mb-1">Low</p>
          <p class="text-white font-semibold">${fmt(range.low)}</p>
        </div>
        <div class="bg-gray-900 rounded-xl py-3 px-2 ring-1 ring-blue-600">
          <p class="text-gray-400 text-xs mb-1">Mid</p>
          <p class="text-white font-semibold">${fmt(range.mid)}</p>
        </div>
        <div class="bg-gray-900 rounded-xl py-3 px-2">
          <p class="text-gray-500 text-xs mb-1">High</p>
          <p class="text-white font-semibold">${fmt(range.high)}</p>
        </div>
      </div>
      <div class="flex justify-between mt-3 text-xs text-gray-400">
        <span>Recommended demand: <span class="text-white font-medium">${fmt(demand)}</span></span>
        <span>Floor: <span class="text-white font-medium">${fmt(floor)}</span></span>
      </div>
    </div>

    <div>
      <p class="text-gray-400 text-xs uppercase tracking-wide mb-2">Execution Package</p>
      <div class="space-y-1 text-gray-300">
        <p>Complaints prepared: <span class="text-white font-medium">${complaints}</span></p>
        <p>Media approach: <span class="text-white font-medium">${media}</span></p>
      </div>
    </div>
  `;

  wrap.appendChild(card);
  messagesEl.appendChild(wrap);
  scrollBottom();
}

// ── Phase polling ─────────────────────────────────────────────────────────────

function setPhaseBar(n, className) {
  const el = document.getElementById('p' + n);
  if (el) el.className = `flex-1 h-1.5 rounded-full ${className} transition-colors duration-500`;
}

function startPolling(missionId) {
  progressPanel.classList.remove('hidden');
  statusBadge.classList.remove('hidden');
  lastPhase = 0;

  pollingTimer = setInterval(async () => {
    let data;
    try {
      const res = await fetch('/api/mission/' + missionId);
      data = await res.json();
    } catch { return; }

    // Update progress bars
    for (let i = 1; i <= 3; i++) {
      if (data.phase > i)       setPhaseBar(i, 'bg-blue-500');
      else if (data.phase === i) setPhaseBar(i, 'bg-blue-400 animate-pulse');
    }

    if (data.phase_label) {
      phaseLabelEl.textContent = data.phase_label;
      statusTextEl.textContent  = data.phase_label;
    }

    // Announce phase transitions in chat
    if (data.phase > lastPhase) {
      const labels = ['', 'Intelligence Gathering', 'Strategic Analysis', 'Execution Planning'];
      if (lastPhase > 0 && data.phase <= 3) {
        addMessage('assistant',
          `Phase ${lastPhase} complete. Running Phase ${data.phase}: ${labels[data.phase]}…`);
      }
      lastPhase = data.phase;
    }

    if (data.status === 'complete') {
      clearInterval(pollingTimer);
      for (let i = 1; i <= 3; i++) setPhaseBar(i, 'bg-green-500');
      phaseLabelEl.textContent = 'Complete';
      setTimeout(() => {
        progressPanel.classList.add('hidden');
        statusBadge.classList.add('hidden');
      }, 1500);
      addResults(data.result || {});
      setInputEnabled(true);

    } else if (data.status === 'error') {
      clearInterval(pollingTimer);
      progressPanel.classList.add('hidden');
      statusBadge.classList.add('hidden');
      addMessage('assistant', `Mission failed:\n\n${data.error}`);
      setInputEnabled(true);
    }
  }, 2000);
}

// ── Input helpers ─────────────────────────────────────────────────────────────

function setInputEnabled(enabled) {
  inputEl.disabled  = !enabled;
  sendBtn.disabled  = !enabled;
  if (enabled) inputEl.focus();
}

async function send(text) {
  addMessage('user', text);
  inputEl.value = '';
  setInputEnabled(false);

  let data;
  try {
    const res = await fetch('/api/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    data = await res.json();
  } catch (err) {
    addMessage('assistant', 'Network error — please try again.');
    setInputEnabled(true);
    return;
  }

  for (const msg of (data.messages || [])) {
    addMessage(msg.role, msg.text);
    if (msg.mission_id) {
      startPolling(msg.mission_id);
      return; // keep input disabled during mission
    }
  }

  setInputEnabled(true);
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (text && !inputEl.disabled) send(text);
});

// ── Boot ──────────────────────────────────────────────────────────────────────

(async () => {
  setInputEnabled(false);
  const res  = await fetch('/api/start', { method: 'POST' });
  const data = await res.json();
  (data.messages || []).forEach(m => addMessage(m.role, m.text));
  setInputEnabled(true);
})();
</script>
</body>
</html>
